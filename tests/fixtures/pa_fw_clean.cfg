set deviceconfig system hostname pa-fw-core
set deviceconfig system ip-address 10.0.0.2
set network interface ethernet ethernet1/1 layer3 ip 203.0.113.2/24
set network interface ethernet ethernet1/2 layer3 ip 192.168.1.1/24
set zone untrust network layer3 ethernet1/1
set zone trust network layer3 ethernet1/2
set address corp-vpn ip-netmask 203.0.113.0/24
set address server-1 ip-netmask 192.168.1.10/32
set service web-443 tcp 443
set rulebase security allow-web-from-vpn from untrust to trust source corp-vpn destination server-1 application web-browsing service web-443 action allow log-end yes
set rulebase security default-deny from any to any source any destination any application any service application-default action deny log-end yes
