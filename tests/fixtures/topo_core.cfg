!
version 15.7
service password-encryption
no ip http server
ip ssh version 2
!
hostname core-rtr
!
ip access-list standard MGMT
 permit 10.0.0.0 0.0.0.255
!
ip access-list extended LAN-RESTRICT
 permit tcp 10.0.1.0 0.0.0.255 host 10.0.2.50 eq 443
 permit tcp 10.0.1.0 0.0.0.255 any eq 53
 deny ip any any log
!
interface GigabitEthernet0/0
 description to-edge
 ip address 10.0.0.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description LAN-A
 ip address 10.0.1.1 255.255.255.0
 ip access-group LAN-RESTRICT in
 no shutdown
!
interface GigabitEthernet0/2
 description LAN-B
 ip address 10.0.2.1 255.255.255.0
 no shutdown
!
logging host 10.0.0.50
banner login ^C Authorized ^C
!
line vty 0 4
 transport input ssh
 login local
 access-class MGMT in
!
end
